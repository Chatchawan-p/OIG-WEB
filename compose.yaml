services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      EVIDENCE_STORAGE_PATH: /app/data/evidence
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - evidence_data:/app/data/evidence

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Deliberately not published to the host by default.

volumes:
  mongo_data:
  evidence_data:
